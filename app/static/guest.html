<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulse — control the room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="guest-body">
  <main class="guest" id="app"></main>
  <script src="/static/shared.js"></script>
  <script>
  (() => {
    const { esc, api, toast, art } = Pulse;
    const $ = (s) => document.querySelector(s);
    const app = $("#app");
    let S = null, results = [], query = "", timer, searchTimer, dragging = false;

    async function poll() {
      try {
        const keepEditing = document.activeElement && document.activeElement.id === "searchinput";
        S = await api("/state");
        if (!S.me) renderJoin();
        else if (!keepEditing && !dragging) renderController();
      }
      catch (e) { toast(e.message, true); }
      finally { timer = setTimeout(poll, 4000); }
    }

    function renderJoin() {
      if ($("#joinf")) return;
      app.innerHTML = `<div class="join-form">
        <a class="wordmark" href="/"><i></i> Pulse</a>
        <div class="join-kicker">You’re invited to</div>
        <h1>${esc(S.party.name)}</h1>
        <p class="muted">Search the music, react to the current song, and help the room decide what stays.</p>
        <form id="joinf" class="join-panel">
          <label for="nickname">What should we call you?</label>
          <input id="nickname" name="nickname" maxlength="24" required autocomplete="nickname" placeholder="Your name">
          <button class="btn">Join the room</button>
        </form>
      </div>`;
      $("#joinf").onsubmit = async (e) => {
        e.preventDefault();
        try { await api("/join", { body: { nickname: e.target.nickname.value } }); clearTimeout(timer); poll(); }
        catch (err) { toast(err.message, true); }
      };
    }

    function renderController() {
      const np = S.now_playing;
      app.innerHTML = `
        <header class="mobile-header">
          <a class="mobile-brand" href="/"><i></i>Pulse</a>
          <span><b></b>${esc(S.party.name)}</span>
        </header>
        <form class="mobile-search" id="searchform">
          <span aria-hidden="true">⌕</span>
          <input id="searchinput" name="q" value="${esc(query)}" placeholder="Search a song or artist" autocomplete="off" enterkeyhint="search">
          ${query ? `<button type="button" id="clearsearch" aria-label="Clear search">×</button>` : ""}
        </form>
        <section id="searchresults" class="search-results ${query ? "open" : ""}">${renderResults()}</section>
        ${np ? nowCard(np) : `<div class="mobile-empty"><div class="record-loader"></div><h2>Waiting for the music</h2><p>The DJ is lining up the next track.</p></div>`}
        <footer class="mobile-footer"><span>${esc(S.me.nickname)}</span><span>${S.stats.guests_active} in the room</span></footer>`;

      bindSearch();
      if (np) {
        $("#like").onclick = () => vote(1);
        $("#dislike").onclick = () => vote(-1);
        bindSlider(np);
      }
      document.querySelectorAll("[data-suggest]").forEach((b) => b.onclick = async () => {
        try {
          await api("/suggest", { body: { track_id: b.dataset.suggest } });
          toast("Added to the room"); query = ""; results = []; clearTimeout(timer); poll();
        } catch (e) { toast(e.message, true); }
      });
    }

    function nowCard(np) {
      const t = np.track;
      const sent = np.my_vote === -1;
      return `<section class="mobile-player">
        <div class="mobile-now-label"><span></span>Now playing</div>
        <div class="mobile-track">
          ${art(t, "mobile-art")}
          <div><h1>${esc(t.title)}</h1><p>${esc(t.artist)}</p></div>
        </div>
        <div class="mobile-ratings" aria-label="Rate this song">
          <button id="dislike" class="rate-button dislike ${np.my_vote === -1 ? "on" : ""}" aria-label="Dislike"><span>×</span><small>Not for me</small><b>${np.down}</b></button>
          <button id="like" class="rate-button like ${np.my_vote === 1 ? "on" : ""}" aria-label="Like"><span>♥</span><small>Love it</small><b>${np.up}</b></button>
        </div>
        <div class="skip-context"><span>Crowd skip</span><strong>${np.down}/${np.skip_threshold.min_votes}</strong></div>
        <div class="slide-skip ${sent ? "sent" : ""}" id="slideskip" aria-label="Slide to add a skip vote">
          <div class="slide-fill" id="slidefill"></div>
          <div class="slide-copy">${sent ? "Skip vote sent" : "slide to skip"}</div>
          <button class="slide-thumb" id="slidethumb" type="button" ${sent ? "disabled" : ""} aria-label="Drag to vote to skip">»</button>
        </div>
        <p class="skip-note">${sent ? "Your vote is in. The room decides together." : "Slide all the way to add your skip vote."}</p>
      </section>`;
    }

    function renderResults() {
      if (!query) return "";
      if (!results.length) return `<div class="search-hint">Type a song, artist, or genre and press search.</div>`;
      return results.slice(0, 6).map((t) => `<div class="search-row">
        ${art(t)}<div><strong>${esc(t.title)}</strong><span>${esc(t.artist)}</span></div>
        <button data-suggest="${esc(t.id)}" aria-label="Request ${esc(t.title)}">+</button>
      </div>`).join("");
    }

    function bindSearch() {
      const input = $("#searchinput");
      input.oninput = (e) => {
        query = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => doSearch(query), 450);
      };
      $("#searchform").onsubmit = (e) => { e.preventDefault(); query = input.value; doSearch(query); };
      const clear = $("#clearsearch");
      if (clear) clear.onclick = () => { query = ""; results = []; renderController(); $("#searchinput").focus(); };
    }

    async function doSearch(q) {
      q = q.trim();
      if (!q) { results = []; query = ""; renderController(); return; }
      try { results = (await api(`/search?q=${encodeURIComponent(q)}`)).tracks; query = q; renderController(); $("#searchinput").focus(); }
      catch (e) { toast(e.message, true); }
    }

    async function vote(value) {
      try {
        const r = await api("/vote", { body: { value } });
        S.now_playing.up = r.up; S.now_playing.down = r.down; S.now_playing.my_vote = r.my_vote;
        renderController();
      } catch (e) { toast(e.message, true); }
    }

    function bindSlider(np) {
      const rail = $("#slideskip"), thumb = $("#slidethumb"), fill = $("#slidefill");
      if (!rail || !thumb || np.my_vote === -1) return;
      let start = 0, max = 0, x = 0;
      const move = (e) => {
        if (!dragging) return;
        x = Math.max(0, Math.min(max, e.clientX - start));
        thumb.style.transform = `translateX(${x}px)`;
        fill.style.width = `${x + thumb.offsetWidth}px`;
      };
      const end = async () => {
        if (!dragging) return;
        dragging = false;
        if (x >= max * .86) {
          thumb.style.transform = `translateX(${max}px)`; fill.style.width = "100%";
          await vote(-1); toast("Skip vote added");
        } else {
          thumb.style.transform = "translateX(0)"; fill.style.width = `${thumb.offsetWidth}px`;
        }
      };
      thumb.onpointerdown = (e) => {
        dragging = true; x = 0; max = rail.clientWidth - thumb.offsetWidth - 8;
        start = e.clientX; thumb.setPointerCapture(e.pointerId);
      };
      thumb.onpointermove = move;
      thumb.onpointerup = end;
      thumb.onpointercancel = end;
    }

    poll();
  })();
  </script>
</body>
</html>
